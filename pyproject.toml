[project]
name = "aioffice-searchpro"
version = "1.5.0"
description = "Adaptive public-page reading and structured extraction for AI agents"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "curl-cffi>=0.15.0",
  "markdownify>=1.2.3",
  "pypdf>=6.14.2",
  "pyyaml>=6.0.3",
  "yt-dlp>=2026.6.9",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[tool.uv]
package = false
